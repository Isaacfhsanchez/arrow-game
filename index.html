<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrow Rush</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Reaction challenge</p>
          <h1>Arrow Rush</h1>
        </div>
        <div class="header-actions">
          <button id="start-btn" class="primary-btn">Start game</button>
        </div>
      </header>

      <main class="game-panel">
        <section class="hud">
          <div class="stat-box">
            <span>Score</span>
            <strong id="score">0</strong>
          </div>
          <div class="stat-box">
            <span>Time</span>
            <strong id="time">60</strong>
          </div>
          <div class="stat-box">
            <span>Streak</span>
            <strong id="streak">0</strong>
          </div>
          <div class="stat-box">
            <span>Lives</span>
            <strong id="lives">3</strong>
          </div>
        </section>

        <section class="arena">
          <p class="status" id="status">Choose a difficulty and begin.</p>
          <div id="target" class="target-arrow" aria-live="polite">✦</div>
        </section>

        <section class="controls" aria-label="Arrow controls">
          <button class="arrow-btn" data-key="ArrowUp" aria-label="Up arrow">↑</button>
          <button class="arrow-btn" data-key="ArrowLeft" aria-label="Left arrow">←</button>
          <button class="arrow-btn" data-key="ArrowDown" aria-label="Down arrow">↓</button>
          <button class="arrow-btn" data-key="ArrowRight" aria-label="Right arrow">→</button>
        </section>
      </main>
    </div>

    <div id="start-overlay" class="overlay visible" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
      <div class="overlay-card">
        <p class="overlay-kicker">Arcade reaction test</p>
        <h2 id="overlay-title">Arrow Rush</h2>
        <p>Match the arrow before time runs out. Correct answers build streaks and score multipliers.</p>

        <div class="difficulty-selector" aria-label="Game difficulty">
          <button class="difficulty-btn active" data-difficulty="normal">Normal</button>
          <button class="difficulty-btn" data-difficulty="easy">Easy</button>
          <button class="difficulty-btn" data-difficulty="hard">Hard</button>
        </div>

        <button id="overlay-start-btn" class="primary-btn large">Play now</button>
      </div>
    </div>

    <div id="game-over-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="game-over-title">
      <div class="overlay-card">
        <p class="overlay-kicker">Round complete</p>
        <h2 id="game-over-title">Game over</h2>
        <p id="final-score-text">Final score: 0</p>
        <p id="best-score-text">Best score: 0</p>
        <button id="restart-btn" class="primary-btn large">Play again</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
